[pytest]
# Pytest configuration for NeonGlyph E2E testing
testpaths = tests/e2e
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --html=test_results/pytest_report.html
    --self-contained-html
    --capture=no
    --log-cli-level=INFO

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test discovery
minversion = 7.0

# Markers for different test categories
markers =
    visual: Visual rendering tests
    performance: Performance testing
    animation: Animation detection tests
    regression: Visual regression tests
    comprehensive: Full test suite
    slow: Tests that take longer to run
    critical: Critical path tests

# Timeout configuration
timeout = 120  # 2 minutes per test

# Parallel testing
numprocesses = auto

# Coverage configuration (if needed)
# addopts = --cov=src --cov-report=html --cov-report=term

# Custom options for visual testing
visual_testing =
    screenshot_on_failure = true
    compare_with_baseline = true
    generate_reference_images = true
    performance_monitoring = true
    animation_detection = true