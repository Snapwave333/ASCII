<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="ng-icon-grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0FF0FC"/>
      <stop offset="100%" stop-color="#FF4D67"/>
    </linearGradient>
    <filter id="ng-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="48" fill="#0D0D0D" stroke="url(#ng-icon-grad)" stroke-width="4"/>
  <text x="128" y="180" font-family="Consolas, monospace" font-size="144" fill="url(#ng-icon-grad)" text-anchor="middle" filter="url(#ng-glow)">@</text>
</svg>