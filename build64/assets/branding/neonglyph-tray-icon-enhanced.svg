<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ng-tray-enhanced-grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0FF0FC"/>
      <stop offset="100%" stop-color="#FF4D67"/>
    </linearGradient>
    <filter id="ng-tray-glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0D0D0D" stroke="url(#ng-tray-enhanced-grad)" stroke-width="2"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="url(#ng-tray-enhanced-grad)" stroke-width="0.5" opacity="0.3"/>
  <text x="16" y="24" font-family="Consolas, monospace" font-size="18" fill="url(#ng-tray-enhanced-grad)" text-anchor="middle" filter="url(#ng-tray-glow)">@</text>
</svg>