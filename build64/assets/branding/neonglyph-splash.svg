<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ng-splash-grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0FF0FC"/>
      <stop offset="100%" stop-color="#FF4D67"/>
    </linearGradient>
    <filter id="ng-splash-glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#000000"/>
  <rect x="64" y="64" width="384" height="384" rx="48" fill="none" stroke="url(#ng-splash-grad)" stroke-width="16" filter="url(#ng-splash-glow)"/>
  <text x="256" y="320" font-family="Consolas, monospace" font-size="256" fill="url(#ng-splash-grad)" text-anchor="middle" filter="url(#ng-splash-glow)">@</text>
  <text x="256" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="48" fill="#FFFFFF" text-anchor="middle">NeonGlyph</text>
  <text x="256" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#CCCCCC" text-anchor="middle">AI-Driven ASCII Visual Synthesis</text>
</svg>